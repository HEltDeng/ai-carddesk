limit_req_zone $binary_remote_addr zone=ai_carddesk:10m rate=8r/s;
server {
    listen 80;
    listen [::]:80;
    server_name ai.mychangliapp.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/ai-carddesk-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ai.mychangliapp.cn;
    ssl_certificate /etc/letsencrypt/live/ai.mychangliapp.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.mychangliapp.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 24k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    error_log /var/log/nginx/ai-carddesk-error.log warn;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 512;
    location / {
        limit_req zone=ai_carddesk burst=40 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8808;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
